<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exam Admin · Tech Verse</title>
  <link rel="icon" href="assets/icons/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="admin-gate" class="admin-gate">
    <div class="loading-screen"><span class="spinner"></span> Verifying admin…</div>
  </div>

  <div class="admin-shell hidden" id="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-title">
        Exam Control
        <button type="button" class="theme-btn" id="theme-btn" style="width:32px;height:32px"><i class="fa-solid fa-sun"></i></button>
      </div>
      <nav>
        <button class="admin-nav-item active" data-section="overview"><i class="fa-solid fa-chart-pie"></i> Overview</button>
        <button class="admin-nav-item" data-section="exams"><i class="fa-solid fa-file-pen"></i> Exams</button>
        <button class="admin-nav-item" data-section="results"><i class="fa-solid fa-trophy"></i> Results</button>
        <button class="admin-nav-item" data-section="leaderboard"><i class="fa-solid fa-ranking-star"></i> Leaderboard</button>
      </nav>
      <div style="margin-top:1.5rem;padding:0 0.5rem;display:flex;flex-direction:column;gap:0.4rem">
        <a href="index.html" class="btn btn-outline btn-sm btn-block">← Exam Site</a>
        <a href="#" id="course-admin-link" class="btn btn-ghost btn-sm btn-block" target="_blank">Course Admin</a>
      </div>
    </aside>

    <main class="admin-main">
      <section class="admin-section active" id="section-overview">
        <div class="admin-section-head">
          <div>
            <h2>Overview</h2>
            <p class="muted">Exam platform snapshot</p>
          </div>
        </div>
        <div class="stat-grid" id="stat-grid"><div class="loading-screen"><span class="spinner"></span></div></div>
        <div class="card">
          <h3 style="margin:0 0 0.75rem">Recent submissions</h3>
          <div id="recent-results"><div class="loading-screen"><span class="spinner"></span></div></div>
        </div>
      </section>

      <section class="admin-section" id="section-exams">
        <div class="admin-section-head">
          <div>
            <h2>Exams</h2>
            <p class="muted">Create, edit questions, link to courses</p>
          </div>
          <button type="button" class="btn btn-primary" id="add-exam-btn"><i class="fa-solid fa-plus"></i> New Exam</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table" id="exams-table">
              <thead><tr><th>Title</th><th>Course</th><th>Questions</th><th>Duration</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="admin-section" id="section-results">
        <div class="admin-section-head">
          <div>
            <h2>All Results</h2>
            <p class="muted">Every student attempt</p>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table" id="results-table">
              <thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>Attempt</th><th>Date</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="admin-section" id="section-leaderboard">
        <div class="admin-section-head">
          <div>
            <h2>Leaderboard</h2>
            <p class="muted">Best scores per exam</p>
          </div>
        </div>
        <div class="field" style="max-width:320px">
          <label>Exam</label>
          <select id="admin-lb-exam"></select>
        </div>
        <div class="card" id="admin-lb-list"></div>
      </section>
    </main>
  </div>

  <div id="toast-root"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
